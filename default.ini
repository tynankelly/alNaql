################################################################################
# AlNaql Configuration File
################################################################################
# 
# AlNaql is a high-performance Arabic text comparison and matching system that
# uses n-gram analysis to identify similar passages between source and target
# text collections. The system is designed for processing large Arabic corpora
# with special handling for Arabic text characteristics including diacritics,
# normalization, and isnad labeling.
#
# Core Capabilities:
# - N-gram generation (character or word-based) with configurable sizes
# - Multiple similarity metrics (Cosine, Jaccard, Levenshtein, Combined)
# - Parallel processing with memory-aware resource management
# - LMDB storage backend for efficient disk-based operations
# - Arabic-specific text preprocessing and normalization
# - Grid-based and streaming processing strategies for large datasets
#
# Configuration Sections:
# - [paths]      : Input/output directory paths
# - [parser]     : Text preprocessing and normalization settings
# - [generation] : N-gram generation parameters
# - [matching]   : Similarity algorithms and thresholds
# - [storage]    : LMDB database configuration
# - [execution]  : Processing strategy and parallelization
# - [resources]  : Memory and resource management
# - [debug]      : Logging and diagnostic settings
#
################################################################################

# ==============================================================================
# [paths] - File and Directory Paths Configuration
# ==============================================================================
# This section defines all filesystem paths used by the system for input,
# output, and intermediate storage. All paths can be absolute or relative
# to the application's working directory.

[paths]

# Directory containing source text files to analyze.
# These are the primary texts that will be compared against target texts.
# Default: "data/source"
source_dir = "data/source"

# Directory containing target text files for comparison.
# These texts will be compared against the source texts to find matches.
# Default: "data/target"
target_dir = "data/target"

# Directory for storing generated source n-grams.
# N-grams generated from source texts are stored here as LMDB databases.
# Each source file gets its own .db subdirectory in this location.
# Ensure sufficient disk space (typically 2-3x the size of source texts).
# Default: "ngrams/source"

ngrams_source_dir = "ngrams/source"

# Directory for storing generated target n-grams.
# N-grams generated from target texts are stored here as LMDB databases.
# Each target file gets its own .db subdirectory in this location.
# Ensure sufficient disk space (typically 2-3x the size of target texts).
# Default: "ngrams/target"
ngrams_target_dir = "ngrams/target"

# Directory for match output files.
# JSON files containing discovered matches between source and target texts
# are written here. Each comparison job creates a separate output file.
#Default: "output/matches"
output_dir = "output/matches"

# temp_dir - Directory for temporary files during processing
# Used for intermediate data, memory-mapped files, and overflow storage
# when memory limits are reached. This directory can grow large during
# processing but is cleaned up after completion.
# Default: "output/temp"
temp_dir = "output/temp"

# ==============================================================================
# [debug] - Debug and Logging Configuration
# ==============================================================================
# This section controls debugging output, diagnostic logging, and tracing
# features used for troubleshooting and performance analysis. These settings
# help identify issues and understand system behavior during development
# and production operations.

[debug]

# Log level for n-gram operations
# Controls the verbosity of logging during n-gram generation and matching.
# Higher verbosity levels provide more detail but can significantly impact
# performance and generate large log files.
# Options: "error", "warn", "info", "debug", "trace", "none"
# Default: "info"

ngram_log = "info"

# Whether to log discarded matches for analysis
# When enabled, records all matches that were found but discarded due to
# filtering criteria (similarity threshold, length requirements, etc.).
# Useful for tuning matching parameters and understanding why expected
# matches aren't appearing in results.
# Type: Boolean (true/false)
# Default: false
# Performance impact: Moderate (additional I/O for each discarded match)
# Use cases:
#   - Parameter tuning: Enable to see what's being filtered
#   - Production: Disable to avoid performance impact
#   - Quality analysis: Enable temporarily to audit matching quality
log_discarded_matches = false

# Path to the file where discarded matches are logged
# File location for writing discarded match information when
# log_discarded_matches is enabled. The file will be created if it doesn't
# exist. Can grow large if many matches are being discarded.
# Default: "logs/discarded_matches.log"

discarded_log_path = "logs/discarded_matches.log"

# Phrase to trace through the matching pipeline for debugging
# Specific text phrase to track through the entire processing pipeline.
# When this phrase is encountered, detailed debugging information is logged
# showing how it's processed at each stage. Extremely useful for understanding
# why specific text is or isn't matching as expected.
# Type: String (empty to disable)
# Default: "" (empty - tracing disabled)
# Performance impact: Minimal if phrase is rare, significant if common
# Usage:
#   - Set to a phrase you expect to match but isn't working
#   - Use a unique phrase to minimize performance impact
#   - Empty string disables tracing entirely
#   - Review log for statements containing "[TRACE]"
# Example traces logged:
#   - Text normalization transformations
#   - N-gram generation details
#   - Similarity calculations
#   - Filtering decisions
#   - Clustering operations
# Example: "بسم الله الرحمن الرحيم"
traced_phrase = ""

# Whether to keep the temp files created during grid processing
keep_temp_files = false

# ==============================================================================
# [parser] - Text Processing and Normalization Configuration
# ==============================================================================
# This section controls how Arabic text is preprocessed before n-gram generation.
# These settings significantly impact matching accuracy and performance.
# Arabic text presents unique challenges including diacritics, character variants,
# and bidirectional text that must be handled appropriately.

[parser]

# remove_numbers - Whether to remove numeric characters from text
# Removes all numeric digits (0-9 and Arabic-Indic numerals ٠-٩) from texts.
remove_numbers = true

# remove_diacritics - Whether to remove Arabic diacritical marks
# Removes all Arabic diacritics (harakat) including fatha, damma, kasra, sukun,
# shadda, and tanween marks (Unicode range U+064B to U+065F and U+0670).
# Default: true

remove_diacritics = true

# remove_tatweel - Whether to remove tatweel (Arabic text elongation character)
# Removes the tatweel character (ـ, U+0640)
# Default: true
remove_tatweel = true

# normalize_arabic - Whether to normalize Arabic character variants
# Converts different forms of Arabic letters to their canonical forms:
# - Converts all forms of alef (آ أ إ) to plain alef (ا)
# - Converts (ى) and (ئ) to ya (ي)
# - Converts (ة) to heh (ه)
# Default: true
normalize_arabic = true

# preserve_punctuation - Whether to preserve punctuation in processed text
# When false, removes all punctuation marks including Arabic punctuation
# (Arabic comma ، semicolon ؛ question mark ؟) and Latin punctuation.
# Default: false

preserve_punctuation = false

# stop_words_file - Optional path to a file containing stop words to filter
# Specifies a text file containing stop words (one per line) that should be
# removed during processing.
# Leave unset or empty to disable stop word filtering.
# The file should be UTF-8 encoded with one word/phrase per line.
# Default: (empty - no stop word filtering)

stop_words_file = ""

# ==============================================================================
# [generation] - N-gram Generation Configuration
# ==============================================================================
# This section controls how n-grams are extracted from processed text.
# N-grams are overlapping sequences of characters or words that form the
# basis for similarity comparison. These settings affect both the quality
# of matches and the computational resources required.

[generation]

# ngram_size - Size of n-grams to generate (n in n-gram)
# Determines the length of text sequences to extract. For character n-grams,
# this is the number of characters; for word n-grams, the number of words.
# Smaller values (2-3) catch more matches but with lower precision.
# Larger values (5-8) are more selective but may miss fuzzy matches.
# Type: Integer (must be > 0)
# Default: 3

ngram_size = 3

# ngram_type - Type of n-grams to generate
# Controls whether n-grams are based on individual characters or complete words.
# Character n-grams are better for capturing partial matches and handling
# morphological variations. Word n-grams are better for exact phrase matching
# and maintaining semantic boundaries.
# Type: String ("character" or "word")
# Default: "character"
# Performance Impact:
#   - Character: More n-grams generated, higher storage requirements
#   - Word: Fewer n-grams, faster processing, but may miss partial matches
ngram_type = "word"

# compute_similarity_features - Whether to compute similarity features during generation
# When enabled, calculates additional features for each n-gram including:
# - Character frequency vectors for advanced similarity metrics
# - Text length and position information
# - Statistical features for cosine similarity
# Enables use of advanced similarity metrics but increases storage by ~30%.
# Type: Boolean (true/false)
# Default: true
# Storage Impact: 
#   - With true: ~26 bytes additional per n-gram
#   - With false: Only stores text and basic metadata
compute_similarity_features = true

# stride - Step size for moving the n-gram window
# Controls how the sliding window moves through text:
# - stride=1: Maximum overlap, generates all possible n-grams (default)
# - stride=n: No overlap, each character/word appears in only one n-gram
# - stride>1: Reduces storage and processing time but may miss matches
# Type: Integer (must be > 0)
# Default: 1
# Example with ngram_size=3, text="ABCDEF":
#   stride=1: "ABC", "BCD", "CDE", "DEF" (4 n-grams)
#   stride=2: "ABC", "CDE" (2 n-grams)
#   stride=3: "ABC", "DEF" (2 n-grams)
stride = 1

# prefix_index_depth - Depth of prefix indexing for fast lookups
# Controls how many initial characters of each n-gram are indexed for rapid filtering.
# Higher values create more granular indexes, speeding up lookups but using
# more memory.
# Type: Integer (minimum 2)
# Default: 3
# Performance Impact:
#   - Higher values: Faster filtering, more memory for index
#   - Lower values: Slower filtering, less memory usage
# Recommendation: Set to min(ngram_size, 3) for optimal balance
prefix_index_depth = 5

# use_parallel - Whether to use parallel processing for ngram generation
# Enables multi-threaded n-gram generation, significantly speeding up
# processing of large files. The text is divided into chunks that are
# processed simultaneously while maintaining correct sequence ordering.
# Type: Boolean (true/false)
# Default: true
# Note: Automatically disabled for small files (<100KB) where overhead
# exceeds benefits. Memory usage increases with parallelization.
use_parallel = false

# thread_count - Number of threads for parallel processing
# Controls the number of worker threads used during parallel generation.
# Set to 0 for automatic detection (uses number of CPU cores).
# Reduce if memory is limited, as each thread requires its own buffers.
# Type: Integer (0 = auto-detect, >0 = specific count)
# Default: 0
# Recommendations:
#   - CPU-bound systems: Set to number of physical cores
#   - Memory-constrained: Set to cores/2 or less
#   - I/O-bound: May benefit from cores*1.5 (experiment)
# Example: 8 cores → thread_count=8 for CPU-bound, =4 for memory-limited
thread_count = 0

# ========== Matching Phase Settings ==========

# ==============================================================================
# [matching] - Similarity Matching and Algorithm Configuration
# ==============================================================================
# This section controls how n-grams are compared to find similar text passages.
# These settings determine match quality, processing strategy, and performance
# characteristics. The system supports multiple algorithms and strategies that
# can be combined for optimal results based on your specific requirements.

[matching]

# ========== Core Strategy Settings ==========

# process_strategy - Overall processing strategy for matching
# Determines how source and target n-grams are compared:
# - "sequential": Process one comparison at a time (lowest memory)
# - "parallel": Process multiple comparisons simultaneously (fastest)
# - "grid": Divide into grid cells for very large datasets (most scalable)
# Type: String
# Default: "sequential"
process_strategy = "grid"

# ngram_matching_strategy - Strategy for n-gram comparison within processing
# Controls how individual n-grams are matched:
# - "sequential": Compare n-grams one by one
# - "parallel": Use parallel matching within each batch
# - "parallelopt": Parallel comparisons
# Type: String
# Default: "sequential"
ngram_matching_strategy = "parallelopt"

# clustering_mode - How to cluster and validate matches
# Determines the method for grouping nearby matches:
# - "sequential": Find clusters in order of appearance
# - "proximity": Cluster based on configurable distance threshold
# - "both": Apply both spatial and proximity clustering
# Type: String
# Default: "sequential"
clustering_mode = "proximity"

# proximity_distance - Maximum distance between n-grams to form a cluster
# N-grams within this distance (in characters) are grouped together.
# Type: Integer (characters)
# Default: 100
proximity_distance = 8

# max_gap - Maximum gap allowed within a cluster
# The largest permitted gap between consecutive n-grams in a cluster.
# Type: Integer (characters)
# Default: 50
max_gap = 10

# ========== Similarity Metrics & Thresholds ==========

# ngram_similarity_metric - Primary similarity metric for n-gram comparison
# Options: "cosine", "jaccard", "levenshtein", "vsa"
# Type: String
# Default: "cosine"
ngram_similarity_metric = "jaccard"

# text_similarity_metric - Metric for comparing full text segments
# Options: "cosine", "jaccard", "levenshtein", "vsa"
# Type: String
# Default: "cosine"
text_similarity_metric = "cosine"

# ngram_min_confidence - Minimum confidence score for individual n-gram matches
# Type: Float (0.0-1.0)
# Default: 0.5
ngram_min_confidence = 0.7

# initial_text_min_confidence - Minimum confidence for initial text matches
# Applied before merging adjacent matches.
# Type: Float (0.0-1.0)
# Default: 0.6
initial_text_min_confidence = 0.8

# merged_text_min_confidence - Minimum confidence after merging matches
# Applied to merged text regions.
# Type: Float (0.0-1.0)
# Default: 0.7
merged_text_min_confidence = 0.7

# min_density - Minimum density of matching n-grams in a region
# Type: Float (0.0-1.0)
# Default: 0.3
min_density = 0.3

# adjacent_merge_ratio - Threshold for merging adjacent matches
# Type: Float (0.0-1.0)
# Default: 0.8
adjacent_merge_ratio = 0.7

# ========== Filtering Options ==========

# use_precomputed_similarity_features - Use features computed during generation
# Speeds up similarity calculations if features were pre-computed.
# Type: Boolean
# Default: true
use_precomputed_similarity_features = true

# enable_prefix_filtering - Whether to use prefix-based filtering
# Type: Boolean (optional, null = auto-detect)
# Default: true
enable_prefix_filtering = true

# enable_metadata_filtering - Filter using n-gram metadata
# Type: Boolean (optional)
# Default: false
enable_metadata_filtering = false

# enable_quick_filtering - Apply fast pre-filtering heuristics
# Type: Boolean (optional)
# Default: true
enable_quick_filtering = false

# enable_length_filtering - Filter by text length constraints
# Type: Boolean (optional)
# Default: true
enable_length_filtering = false

# ========== Chain/Length Requirements ==========

# min_word_length - Minimum words in a valid match
# Type: Integer
# Default: 5
min_word_length = 5

# min_chars_length - Minimum total characters in a match
# Type: Integer
# Default: 20
min_chars_length = 20

# ========== Banality Detection Settings ==========
# Banality detection identifies and down-weights common/trivial text patterns

# banality_detection_mode - How to detect banal (common) text
# Options: "" (none), "auto", "phrase"
# Type: String
# Default: "phrase"
banality_detection_mode = "phrase"

# Percentage of most common n-grams to consider as potentially banal
# Higher values include more n-grams, lower values are more selective
# Range: 0.0 - 100
banality_auto_proportion = 5

# Threshold percentage for automatic banality detection
# Text is considered banal if this percentage of its n-grams are in the common set
# Range: 0.0 - 100.0
banality_auto_threshold = 80

# Proportion of banal n-grams in a potential match (automatic and file)
# which to marks region as banal
# Type: Float (0.0-1.0)
# Default: 0.5
banality_density_threshold = 0.8

# Batch size for automatic banality detection
# Type: Integer
# Default: 10000
auto_banal_batch_size = 10000

# banality_phrases_file - Path to file with banal phrases (one per line)
# Type: String (path)
# Default: ""
banality_phrases_file = "filters/banalities_phrases.txt"

# Path to file with banal words (one per line)
# Type: String (path)
# Default: ""
banality_words_file = "filters/banalities_words.txt"

# ========== Isnad Detection Settings ==========
# Isnad detection identifies chains of transmission in Islamic texts

# isnad_density_threshold - Density threshold for isnad detection
# Type: Float (0.0-1.0)
# Default: 0.65
isnad_density_threshold = 0.6

# isnad_min_length - Minimum length for isnad chains
# Type: Integer
# Default: 25
isnad_min_length = 25

# isnad_phrases_file - Path to file with isnad phrases
# Type: String (path)
# Default: ""
isnad_phrases_file = "filters/isnad_phrases.txt"

# isnad_words_file - Path to file with isnad indicator words
# Type: String (path)
# Default: ""
isnad_words_file = "filters/isnad_words.txt"

# ========== Post-processing Settings ==========

# How to handle duplicate matches when using both sequential and poximity clustering
# Options: "none", "keep_best", "merge", "hierarchical"
# Type: String
# Default: "keep_best"
deduplication_strategy = keep_best

# ============================================================================
# BANALITY AND WORD-WEIGHTED SIMILARITY ALGORITHM
# ============================================================================
# This algorithm reduces the influence of formulaic/boilerplate text in 
# similarity calculations through continuous penalty scaling.
#
# STEP 1: Calculate Base Similarities
# - LCS Similarity: Word-level Longest Common Subsequence between source and target
#   Formula: 2 * lcs_length / (source_words + target_words)
# - Base Algorithm Similarity: From the primary similarity metric (Jaccard, etc.)
#
# STEP 2: Assess Banality Density
# Calculates what proportion (0.0 to 1.0) of the source text consists of 
# banal/formulaic content based on the detection mode:
# - "phrase" mode: Proportion of words matching predefined banal phrases/words
# - "automatic" mode: Proportion of n-grams that are in the top 5% most common
#
# STEP 3: Apply Linear Banality Penalty
# banality_factor = 1.0 - (banality_density / banality_scale_factor)
# 
# This creates a smooth linear penalty:
# - 0% banal (density=0.0): factor = 1.0 (no penalty)
# - 25% banal (density=0.25): factor = 0.5 with scale_factor=0.5
# - 50% banal (density=0.5): factor = 0.0 with scale_factor=0.5 (maximum penalty)
# - Densities above scale_factor would give negative factors (clamped to 0)
#
# STEP 4: Weight and Combine
# weighted_lcs = lcs_similarity * banality_factor
# final_similarity = (weighted_lcs * lcs_weight) + (base_similarity * algorithm_weight)
#
# EXAMPLE with scale_factor=0.5, lcs_weight=0.3, algorithm_weight=0.7:
# For a match with 0.8 LCS similarity and 0.9 base algorithm similarity:
# - 0% banal:  (0.8 * 1.0 * 0.3) + (0.9 * 0.7) = 0.24 + 0.63 = 0.87
# - 20% banal: (0.8 * 0.6 * 0.3) + (0.9 * 0.7) = 0.144 + 0.63 = 0.774
# - 40% banal: (0.8 * 0.2 * 0.3) + (0.9 * 0.7) = 0.048 + 0.63 = 0.678
# - 50% banal: (0.8 * 0.0 * 0.3) + (0.9 * 0.7) = 0.0 + 0.63 = 0.63
#
# This ensures highly formulaic text contributes progressively less to similarity.
# ============================================================================

# Apply banality/word weighting to text regions
# Type: Boolean
# Default: true
apply_text_weighting = true

# lcs_weight - Weight for Longest Common Subsequence in combined metrics
# Controls how much word-order similarity contributes vs base algorithm
# Type: Float (0.0-1.0)
# Default: 0.7
lcs_weight = 0.7

# algorithm_weight - Weight for primary algorithm in combined metrics  
# Controls how much the base similarity algorithm contributes
# Note: lcs_weight + algorithm_weight should = 1.0
# Type: Float (0.0-1.0)
# Default: 0.3
algorithm_weight = 0.3

# banality_scale_factor - Weight applied to text classified as banal
# When text is determined to be banal (exceeds banality_density_threshold),
# its LCS similarity is multiplied by this factor before final calculation
# Lower values = stronger penalty for banal text
# Type: Float (0.0-1.0)
# Default: 0.5
banality_scale_factor = 0.3

# ========== Algorithm-specific Settings ==========

# levenshtein_max_distance - Maximum edit distance for Levenshtein
# Type: Integer
# Default: 10
levenshtein_max_distance = 20

# vsa_min_term_weight - Minimum term weight for VSA algorithm
# Type: Float
# Default: 0.01
vsa_min_term_weight = 0.01

# ========== Cache and Chunk Settings ==========

# Size of internal caches for similarity computation
# Type: Integer
# Default: 10000
cache_capacity = 10000

# Parallel chunks for matching: Minimum size of source chunks (n-grams)
# Type: Integer
# Default: 1000
min_source_chunk = 1000

# Parallel chunks for matching: Maximum size of source chunks (n-grams)
# Type: Integer
# Default: 50000
max_source_chunk = 50000

# Parallel chunks for matching: Number of source chunks per CPU core
# Type: Integer
# Default: 2
source_chunks_per_cpu = 4

# Parallel Ngram Processing: Chunk size for parallel source processing
# Type: Integer
# Default: 5000
parallel_source_chunk_size = 2000

# Parallel Ngram Processing: Chunk size for parallel target processing
# Type: Integer
# Default: 5000
parallel_target_chunk_size = 5000

# Grid Comparison: Maximum comparisons per grid cell
# Type: Integer
# Default: 10000000
comparisons_per_cell = 5000000000

# Chunk size for similarity calculations, how many target ngrams at a time
# Type: Integer
# Default: 1000
similarity_chunk_size = 5000


# Buffered parallel processing for writing parallel chunks to temp files
# in accordance with available
use_buffered_parallel = true
parallel_buffer_memory_limit = 104857600
parallel_buffer_match_limit = 10000
parallel_buffer_time_limit = 300

# ==============================================================================
# [storage] - LMDB Storage Backend Configuration
# ==============================================================================
# This section configures the Lightning Memory-Mapped Database (LMDB) backend
# used for storing and retrieving n-grams. LMDB provides extremely fast
# read performance through memory-mapped files while maintaining ACID transactions.
# These settings significantly impact I/O performance and memory usage.

[storage]

# Path to the LMDB database directory
# Base directory where LMDB database files will be created. Each n-gram
# database creates a subdirectory here containing data.mdb and lock.mdb files.
# Choose a location with fast I/O (SSD recommended) and sufficient space.
# Default: "ngrams"
db_path = "ngrams"


# Whether to force sync on every transaction
# When true, forces data to be written to disk on each transaction commit.
# Ensures durability but significantly impacts write performance.
# Type: Boolean (true/false)
# Default: false
# Recommendations:
#   - false: For generation phase (can regenerate if needed)
#   - true: For critical data that cannot be regenerated
# Performance impact: Can reduce write speed by 10-100x
use_fsync = false

# is_bulk_loading - Whether bulk loading mode is active
# Optimizes database for initial loading by relaxing durability constraints
# and optimizing write patterns. Significantly improves generation performance.
# Should be false during matching phase for better read performance.
# Type: Boolean (true/false)
# Default: false
# Performance impact: Can improve write speed by 2-5x
# WARNING: Do not use for incremental updates to existing databases
is_bulk_loading = false

# allow_mmap_reads - Whether to allow memory-mapped reads
# When true, uses memory mapping for reading data (LMDB default behavior).
# Provides zero-copy reads and excellent performance for cached data.
# Type: Boolean (true/false)
# Default: true
# Note: Almost always should be true for LMDB
allow_mmap_reads = true

# allow_mmap_writes - Whether to allow memory-mapped writes
# When true, writes directly to memory-mapped regions. Can improve
# performance but may cause issues on some systems with limited address space.
# Type: Boolean (true/false)
# Default: true
# Recommendations:
#   - true: 64-bit systems with sufficient virtual memory
#   - false: 32-bit systems or when experiencing mmap errors
allow_mmap_writes = true

# lmdb_max_readers - Maximum number of LMDB reader slots
# Maximum number of concurrent read transactions. Each thread performing
# reads needs a reader slot. Increase for highly parallel read workloads.
# Type: Integer (optional, null = use LMDB default)
# Default: 126
# Range: 1-32767
# Recommendations:
#   - Single-threaded matching: 10-50
#   - Parallel matching: 100-500
#   - Grid processing: 500-1000
# Memory impact: Minimal (a few KB per slot)
lmdb_max_readers = 1000

# lmdb_max_dbs - Maximum number of named LMDB databases
# Maximum number of named databases within the environment. The system
# uses multiple databases for different data types (text, features, metadata).
# Type: Integer (optional, null = use LMDB default)
# Default: 100
# Range: 1-32767
# Recommendations:
#   - Standard usage: 100 (sufficient for all column families)
#   - With heavy partitioning: 200-500
# Note: Set higher if using prefix partitioning with many partitions
lmdb_max_dbs = 400

#============================Compaction settings================================

# Initially, databases are sized according to pre-allocated maps, which will nearly
# always be too big. With compaction, we regenerate the database with exact sizing.
enable_post_generation_compaction = true
# The extra padding the regenerated database is granted
compaction_buffer_percentage = 5.0
# Batch size for moving data to new database
compaction_batch_size = 10000
# No databases under this size (megabytes) will be compacted
compaction_min_size_mb = 50
# Do we keep the original database?
keep_original_on_compaction = true
# ==============================================================================
# [execution] - Execution Strategy and Parallelization Configuration
# ==============================================================================
# This section controls how the system executes matching operations, including
# parallelization strategies, thread management, and storage access patterns.
# These settings determine the balance between performance and resource usage.

[execution]

# ========== NGram Generation Processing Mode ==========

# processing_mode - Overall processing mode for the ngram generation
# Determines whether generation runs sequentially or in parallel.
# Type: String ("sequential" or "parallel")
# Default: "sequential"
# Recommendations:
#   - "sequential": Single-core systems, debugging, memory-constrained
#   - "parallel": Multi-core systems with adequate memory
# Note: Even in sequential mode, some operations may use threads for I/O
processing_mode = "sequential"


# max_concurrent_files - Maximum concurrent files to process during ngram generation
# Limits how many files are processed simultaneously. Prevents resource
# exhaustion from too many open file handles and threads.
# Type: Integer
# Default: 10
# Recommendations:
#   - Many small files: 20-50
#   - Few large files: 2-10
#   - Limited file handles: 5-10
max_concurrent_files = 10

# ========== Storage Access Strategy ==========

# storage_access_strategy - Strategy for accessing storage backend
# Determines how threads access the LMDB database:
# - "shared": Single connection shared across threads (safe but may bottleneck)
# - "exclusive": Each thread gets exclusive access (best for reads)
# - "pooled": Connection pool with reusable connections (balanced approach)
# Type: String ("shared", "exclusive", or "pooled")
# Default: "shared"
# Recommendations:
#   - "shared": Sequential processing or few threads
#   - "exclusive": Read-heavy parallel workloads
#   - "pooled": Mixed read/write workloads with many threads
# Note: LMDB allows multiple readers but only one writer
storage_access_strategy = "exclusive"

# ==================Parallel comparison processing=================
# Set to >1 to enable parallel comparisons; be mindful of available memory
max_parallel_comparisons = 1
# How much memory does each comparison require, used to calculate how many
#comparisons
min_memory_per_comparison = 4096 

# min_threads_per_comparison - Minimum threads per comparison
# Floor value for thread allocation. Even under memory pressure or when
# dividing resources among parallel comparisons, never go below this.
# Type: Integer
# Default: 8
# Range: 1-64
# Recommendations:
#   - Memory-constrained systems: 2-4
#   - Standard systems: 6-8
#   - High-performance systems: 8-12
# Note: Must be less than optimal_threads_per_comparison
min_threads_per_comparison = 6

# optimal_threads_per_comparison - Optimal threads per comparison
# Target thread count based on performance tuning. This is the ideal
# number of threads for a single comparison when resources are available.
# Type: Integer
# Default: 10
# Range: 1-128
# Recommendations:
#   - Sequential matching: 8-12 (tuned for your workload)
#   - Parallel comparisons: 6-10 (to allow multiple jobs)
#   - Memory-constrained: 4-8
# Note: Should be between min and max threads values
optimal_threads_per_comparison = 8

# max_threads_per_comparison - Maximum threads per comparison
# Ceiling value for thread allocation. Even on large machines, don't
# exceed this to prevent diminishing returns and resource waste.
# Type: Integer
# Default: 12
# Range: 1-256
# Recommendations:
#   - Standard workloads: 12-16
#   - Large documents: 16-24
#   - Grid processing: 20-32
# Note: Must be greater than optimal_threads_per_comparison
max_threads_per_comparison = 12

# memory_pressure_threshold - Memory usage threshold for thread reduction
# When system memory usage exceeds this percentage, reduce thread count
# to prevent swapping and OOM conditions.
# Type: Float (percentage)
# Default: 85.0
# Range: 50.0-95.0
# Recommendations:
#   - Production systems: 85.0-90.0
#   - Development/testing: 75.0-85.0
#   - Memory-critical environments: 70.0-80.0
memory_pressure_threshold = 85.0

# memory_pressure_reduction_factor - Thread reduction factor under pressure
# Multiplier applied to thread count when memory pressure is detected.
# A value of 0.5 means use half the threads under memory pressure.
# Type: Float (multiplier)
# Default: 0.5
# Range: 0.1-0.9
# Recommendations:
#   - Aggressive reduction: 0.3-0.5
#   - Moderate reduction: 0.5-0.7
#   - Conservative reduction: 0.7-0.9
memory_pressure_reduction_factor = 0.5

# Enable to reuse database handles
enable_db_pooling = true
#Options: unrestricted, smart, pooled
parallel_strategy = pooled

# ========== Dense Region Processing ==========
# Dense regions are areas with high concentrations of matches that need special handling

# Enable parallel processing for dense region finding
# When true, uses parallel algorithms to identify regions with many matches.
# Dense regions often dominate processing time and benefit from parallelization.
# Type: Boolean (true/false)
# Default: false
# Performance impact: Significant for texts with clustering patterns
parallel_dense_regions = true

# parallel_dense_threshold - Minimum matches to trigger parallel dense processing
# Number of matches in a region before switching to parallel algorithms.
# Lower values use parallelization more often but may add overhead.
# Type: Integer
# Default: 1000
# Recommendations:
#   - Many small clusters: 500-1000
#   - Few large clusters: 2000-5000
#   - Uniform distribution: 5000-10000
# Note: Only applies if parallel_dense_regions is true
parallel_dense_threshold = 1000

# min_dense_chunk_size - Minimum chunk size for dense region processing
# Smallest unit of work when processing dense regions. Prevents excessive
# fragmentation and overhead from too-small work units.
# Type: Integer (n-grams)
# Default: 100
# Recommendations:
#   - High thread count: 50-100
#   - Low thread count: 200-500
#   - Single thread: Not applicable
# Balance: Smaller = better load balancing, Larger = less overhead
min_dense_chunk_size = 10000

# max_dense_chunk_size - Maximum chunk size for dense region processing
# Largest unit of work when processing dense regions. Prevents thread
# starvation from overly large work units.
# Type: Integer (n-grams)
# Default: 10000
# Recommendations:
#   - Uniform data: 10000-20000
#   - Skewed data: 5000-10000
#   - Real-time requirements: 1000-5000
# Note: Should be at least 10x min_dense_chunk_size
max_dense_chunk_size = 100000

# Number of chunks to process in parallel during clustering
# 0 or unset = use number of CPU cores
parallel_clustering_chunks = 20


# Set the size of chunks for parallel processing of ngram clusters during
# grid processing.
# Type: Integer
# Default: 100000
grid_cluster_chunks = 5000

# ========== Parallel Validation ==========

# validation_batch_size - Number of clusters to validate in parallel batches
# Higher values use more memory but improve throughput. Each cluster typically
# requires 500-2000 bytes of memory during processing.
# Type: Integer
# Default: 5000
# Range: 100-100,000
# Recommendations:
#   - Memory-constrained systems (< 8GB): 1000-2000
#   - Standard systems (8-32GB): 5000-10000
#   - High-memory systems (> 32GB): 10000-20000
# Memory impact: batch_size × 2KB ≈ memory usage (5000 × 2KB = 10MB typical)
validation_batch_size = 5000

# ===========Final Results Streaming for Grid Matching============

final_merge_chunk_size = 50000
boundary_window_percent = 5.0
boundary_safety_multiplier = 3.0


# Binary I/O Configuration
[binary_io]
# Output format: binary, json, or both (default: both)
# "both" generates two files - one binary and one JSON
output_format = json

# Compress final binary output (only applies to .bin files)
compress_final_output = true  

# Buffer sizes in KB
read_buffer_kb = 256
write_buffer_kb = 256

# Compression buffer pool size
compression_pool_size = 16